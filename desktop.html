<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Axis</title>
    <!-- The desktop app's entry. Its own page and its own build (vite.desktop.config.js), so nothing
         desktop-only ever lands in the phone app's bundle. Boot screen and theme pick are the same as
         index.html's — see the comments there; keep the palette blocks in step with it. -->
    <style>
      :root { --boot-bg:#0f0f10; --boot-track:#2e2e33; --boot-spin:#4f8ef7 }
      html.boot-light { --boot-bg:#f2f2f5; --boot-track:#d8d8de; --boot-spin:#2f6fe0 }
      html.boot-amarr { --boot-bg:#14100a; --boot-track:#3a3021; --boot-spin:#e5b53e }
      html.boot-sansha { --boot-bg:#0d0809; --boot-track:#33262a; --boot-spin:#bd7679 }
      html.boot-intaki { --boot-bg:#080b11; --boot-track:#28323f; --boot-spin:#8fb8d9 }
      html, body { background:var(--boot-bg) }
      #boot { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
              background:var(--boot-bg) }
      #boot i { width:30px; height:30px; border-radius:50%; border:3px solid var(--boot-track);
                border-top-color:var(--boot-spin); animation:boot-spin .7s linear infinite }
      @keyframes boot-spin { to { transform:rotate(360deg) } }
      @media (prefers-reduced-motion:reduce) { #boot i { animation-duration:2.4s } }
    </style>
    <script>
      try {
        var p = localStorage.getItem('axis_theme_pref') || 'dark';
        if (p === 'system') p = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        if (p !== 'dark') document.documentElement.classList.add('boot-' + p);
      } catch (e) {}
      // The hosted browser build only (%MODE% is Vite's, so the installed app never runs this): a
      // phone gets the phone app at /m/ (lib/web-build.js), before the desktop bundle even loads,
      // unless it chose the desktop layout. A popped-out window never moves.
      try {
        var view = localStorage.getItem('axis_web_view');
        var phone = matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 600;
        if ('%MODE%' === 'web' && !/[?&]satellite=/.test(location.search) && (view === 'phone' || (view !== 'desktop' && phone)))
          location.replace('/m/' + location.search + location.hash);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><div id="boot"><i></i></div></div>
    <script type="module" src="/src/desktop/main.jsx"></script>
  </body>
</html>
